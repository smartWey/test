最近都在使用ai做一些工作，发现ai有很多名词概念，今天就简要分享下ai相关的概念及演变过程。

首先还是要用语言模型说起，语言模型本身就是对自然语言的解析，为了解析的更精准，给模型添加的东西越来越多，也越来越智能。针对这个更智能的模型，给他起名叫大语言模型，llm。大语言模型的本质还是对上下文的一个续写，为了让它能够更方便使用，我们就套了个壳子，让它扮演一个角色，按照那个角色去续写。

我们与大模型进行对话，发给大模型的内容就是prompt（提示词）。提示词中的内容可以分为两个部分，一部分就是提问的内容，想要获取结果。另一部分就是关于问题的背景信息、约束条件等等，我们把这部分内容叫做context（上下文）。

这个时候我们就完成与大模型的一次对话，但是它不能连续对话，下次再提问它就不记得之前的内容了。为了让它记住之前的内容，我们决定每次提问的时候就把之前对话的内容进行压缩提取，把提取的内容再当作context一起发给大模型，这样它就像拥有了记忆。我们把压缩提取的过程叫做memory。

现在我们可以与大模型进行连续的对话，相当于人有了大脑，可以进行分析决策，但是它不能真的帮我做一些事情。最开始使用就只能我问大模型一个问题，它返回一个结果需要干什么，我干完之后再把结果发给它，让它继续处理。这样就显得很麻烦，我们就想能不能写个程序来代理我们完成这个工作。于是我们就有了agent（智能体）的概念，智能体就是一个程序，它能够根据大模型的输出结果来执行一些操作，比如调用一些工具、访问一些数据等等。

现在大模型调用程序还是通过自然语言来进行的，可能会存在一起歧义，不够稳定，于是我们给大模型制定了一个与智能体通信的格式，叫做function calling。通过function calling，大模型可以直接调用智能体提供的函数接口来执行操作，这样就大大提高了效率和稳定性。

随着智能体中的工具越来越多，显得很臃肿。我们就想能不能把智能体中的工具分离出来，单独部署一个服务器，智能体需要使用工具的时候去这个服务器上调用。我们给智能体与工具服务器之间的通信制定了一个通信协议，叫mcp。

现在使用大模型的流程就变成了，我跟agent对话，agent把我的对话内容发给大模型，发模型进行解析。解析之后通过function calling告诉agent需要调用什么工具，agent通过mcp协议去调用工具服务器上的函数接口。工具服务器执行完操作之后把结果返回给agent，agent再把结果发给大模型，大模型根据结果继续进行分析决策，最后把结果返回给我。

在使用的时候发现，有些流程是固定的，我们并不需要每次都要把问题交给大模型去处理，于是就有了一个固化流程的代码框架langchain。langchain是一个代码编写框架，对于普通用户使用起来并不友好，于是推出了界面可拖拽的可视化工具，叫workflow。当需要处理的问题种类越来越多，越来越复杂，我们需要在这个流程里面添加判断，去选择加载，这时候就有了skill，它可以实现内容的渐进式加载。根据实际的使用需求，按需加载这些固定的上下文或流程。

这基本就是现在ai概念的一个演变过程。总结起来就是，LLM进行决策分析，prompt/context告诉大模型该做什么，memmemory让对话更连贯，agent就像人的手脚去完成大模型交代的工作。余下其他的一些内容都是围绕agent来的，为了让agent的流程更简单，使用起来更方便。
